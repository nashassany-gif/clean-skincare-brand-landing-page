<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin sign in — loam</title><link rel="stylesheet" href="/admin/admin.css?v=20261025-reliability"></head><body><main class="shell login"><div class="brand">loam</div><div class="card"><h1>Admin sign in</h1><p class="muted">Authorized staff only. Sessions expire after 8 hours or 30 minutes of inactivity.</p><form id="login"><div class="field"><label for="username">Username</label><input id="username" name="username" autocomplete="username" required maxlength="64"></div><div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="256"></div><p id="error" class="error" role="alert"></p><button class="btn" id="submit" type="submit">Sign in</button></form><p class="footnote">No public registration. Administrators are initialized only from the server console.</p></div></main><script src="/admin/login.js?v=20261025-reliability"></script></body></html>
