name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      allow_migration:
        description: "Allow this run to pass the GitHub-side migration gate. A server-side approval marker is still required."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.1"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test

  deploy:
    needs: test
    if: github.repository == 'nashassany-gif/clean-skincare-brand-landing-page'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Migration gate
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          ALLOW: ${{ inputs.allow_migration }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            base="$(git rev-parse HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)"
          else
            base="$BEFORE"
            if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              base="$(git rev-parse HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)"
            fi
          fi

          if git diff --name-only "$base" "$SHA" | grep -qx 'server/database.js'; then
            if [ "$ALLOW" != "true" ]; then
              echo "::error::server/database.js changed. Review the migration, take a backup, create /srv/loam-shared/allow-migration-$SHA on the VPS, then run this workflow manually with allow_migration=true."
              exit 1
            fi
          fi

      - name: Deploy to VPS
        env:
          DEPLOY_KEY: ${{ secrets.LOAM_DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.LOAM_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.LOAM_DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.LOAM_DEPLOY_PORT }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.LOAM_DEPLOY_KNOWN_HOSTS }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/loam_deploy"
          chmod 600 "$HOME/.ssh/loam_deploy"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          ssh -i "$HOME/.ssh/loam_deploy" -p "$DEPLOY_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o UpdateHostKeys=no -o PermitLocalCommand=no -o ClearAllForwardings=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" "deploy $SHA"
